name: Build Cog image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install . pytest
      - run: python -m pytest -q

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cog
        run: |
          sudo curl -sL -o /usr/local/bin/cog "https://github.com/replicate/cog/releases/latest/download/cog_$(uname -s)_$(uname -m)"
          sudo chmod +x /usr/local/bin/cog
      - name: Build the slim release image
        run: cog build --use-cog-base-image=false -t ghcr.io/${GITHUB_REPOSITORY,,}:latest
      - run: docker push ghcr.io/${GITHUB_REPOSITORY,,}:latest
